<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Whot Game</title>
</head>

<body>
    <h1>Create Whot Game </h1>
    
    <div>
        <a href="/game"> New Game</a>
       
            
        <input type="text" id="game_id" name="game_id" placeholder="Enter Game ID">
        <button type="submit">Join Game</button>
        
    </div>
    
</body>

<script>
const gameIdInput = document.getElementById('game_id');
const joinButton = document.querySelector('button[type="submit"]');

joinButton.addEventListener('click', function(event) {
    // event.preventDefault();
    const gameId = gameIdInput.value.trim();
    if (gameId) {
        window.location.href = `${window.location.href}game?join=${gameId}`;
    } else {
        alert('Please enter a valid Game ID.');
    }
});
</script>

</html>
